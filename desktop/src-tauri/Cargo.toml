[package]
name = "ivybells-desktop"
version = "0.2.0"
description = "Ventana de escritorio de IvyBells: abre la interfaz web y lanza la API de Python"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
# Misma version que jacck_tauri y Venona: la compilacion compartida se reutiliza.
tauri = { version = "=2.12.5", features = [] }
# Copia de jacck_common dentro del proyecto: se trae con vendor/sync_jacck_common.py.
jacck_tauri = { path = "../../vendor/jacck_common/rust/jacck_tauri" }
# Dialogo nativo de Guardar (la misma version que Venona). Va aqui y no en jacck_tauri:
# tauri-build solo ve los permisos de los plugins que la app declara directamente.
tauri-plugin-dialog = "=2.8.4"
