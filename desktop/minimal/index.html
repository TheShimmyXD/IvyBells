<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>IvyBells</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
        background: Canvas;
        color: CanvasText;
      }
      main {
        max-width: 36rem;
        margin: 15vh auto;
        padding: 0 1rem;
      }
      h1 {
        font-size: 1.6rem;
        margin-bottom: 0.25rem;
      }
      p {
        line-height: 1.5;
      }
      .muted {
        opacity: 0.65;
      }
      #status[data-state="ok"] {
        color: #2e7d32;
      }
      #status[data-state="error"] {
        color: #c62828;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>IvyBells</h1>
      <p class="muted">Ventana mínima de Tauri sobre el crate común <code>jacck_tauri</code>.</p>
      <p id="status" data-state="wait">Esperando la API de Python…</p>
      <p id="detail" class="muted"></p>
    </main>
    <script src="main.js"></script>
  </body>
</html>
