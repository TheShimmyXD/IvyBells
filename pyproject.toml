[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ivybells"
version = "0.2.0"
description = "Transcripción en tiempo real local (GPU) de audio del sistema y del micrófono."
requires-python = ">=3.13"
dependencies = [
    # Motor: faster-whisper en la GPU; cuBLAS y cuDNN por pip (sin CUDA Toolkit).
    "faster-whisper>=1.2.1",
    "nvidia-cublas-cu12>=12.9",
    "nvidia-cudnn-cu12>=9,<10",
    "numpy>=2",
    # Contexto del Agente: texto de PDF y Word (.docx).
    "pypdf>=6.21",
    "python-docx>=1.2",
]

[project.optional-dependencies]
# fonttools[woff]: resources/build_web_fonts.py (letras e iconos de la ventana en WOFF2).
dev = ["pytest>=9", "ruff>=0.17", "fonttools[woff]>=4.68"]
# Ventana de Tauri: API local sobre jacck_common, que no se publica; install.sh lo instala
# antes desde ../jacck_common (maquina del autor) o desde vendor/jacck_common.
web = ["jacck_common[webapi]>=0.2.0", "httpx>=0.28"]

[tool.setuptools]
# Solo se instalan las dependencias; el código se ejecuta desde la carpeta.
packages = []
py-modules = []

[tool.python-programmer]
# Tipo de proyecto para check_structure.py: "web" (domain/services/app/entrypoints y web/).
type = "web"
# Agente_IvyBells guarda trabajo del agente (maquetas, notas), no codigo de la app.
exclude = ["vendor/jacck_common", "Agente_IvyBells"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
# .claude/ guarda skills del agente: no son código del proyecto.
# vendor/jacck_common es copia de otro proyecto: se revisa alla.
extend-exclude = ["resources", ".claude", "vendor/jacck_common"]

[tool.ruff.lint]
# E/F: errores básicos, I: orden de imports, UP: sintaxis moderna,
# B: errores frecuentes, SIM: simplificaciones, T20: prohíbe print,
# RUF100: avisa de los noqa que ya no silencian nada.
select = ["E", "F", "I", "UP", "B", "SIM", "T20", "RUF100"]
# La longitud de línea la resuelve `ruff format`; no se duplica el aviso.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["T20"]
