[project]
name = "ivybells"
version = "0.1.0"
description = "Transcripción en tiempo real local (GPU) de audio del sistema y del micrófono."
requires-python = ">=3.13"
dependencies = [
    "PySide6",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
