# Pruebas en cada push, sin GPU ni audio: ruff y pytest (motor, PipeWire y Claude falsos)
# y la web (tipos, lint, formato y Vitest). El motor (faster-whisper, cuBLAS, cuDNN) no se
# instala: las pruebas no lo cargan. Mismas versiones que el .venv de desarrollo.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Dependencias sin el motor
        run: |
          python -m pip install "./vendor/jacck_common[webapi]"
          python -m pip install ruff==0.17.1 pytest==9.1.1 httpx==0.28.1 \
            numpy==2.5.4 pypdf==6.21.1 python-docx==1.2.0 fonttools==4.68.0 brotli==1.2.1
      - name: ruff
        run: |
          ruff check .
          ruff format --check .
      - name: pytest
        run: python -m pytest -q

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npx prettier --check .
      - run: npm test
